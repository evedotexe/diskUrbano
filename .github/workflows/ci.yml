name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, dev]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Install jest
        run: npm install --save-dev jest

      - name: Run lint
        run: node ./node_modules/eslint/bin/eslint.js . --ext .js || true

      - name: Run tests
        run: node ./node_modules/jest/bin/jest.js --passWithNoTests
